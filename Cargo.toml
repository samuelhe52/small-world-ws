[workspace]
members = [".", "crates/small-world-core"]
resolver = "3"

[package]
name = "small-world-ws"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
small-world-core = { path = "crates/small-world-core" }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }

[profile.release]
lto = "thin"
codegen-units = 1
